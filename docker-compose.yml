services:

  web:
    build: ./web
    ports:
      - "8080:8080"
    environment:
      MONGO_URI: mongodb://mongo:27017
      DB_NAME: routerdb
    depends_on:
      - mongo
    networks:
      - app-net

  mongo:
    image: mongo:6
    volumes:
      - mongo-data:/data/db
    networks:
      - app-net

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - app-net

  scheduler:
    build: ./scheduler

    environment:
      MONGO_URI: ${MONGO_URI}
      DB_NAME: ${DB_NAME}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

    depends_on:
      - mongo
      - rabbitmq
    networks:
      - app-net

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: always
    deploy:
      replicas: 1
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - MONGO_URI=mongodb://mongo:27017
      - DB_NAME=routerdb
      - PYTHONUNBUFFERED=1
    depends_on:
      - rabbitmq
      - mongo
    networks:
      - app-net
    

volumes:
  mongo-data:

networks:
  app-net: